name: dotnet-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build all projects
        run: |
          for p in src/FutureCop.Assets src/FutureCop.Audio src/FutureCop.Game src/FutureCop.Gpu src/FutureCop.Gpu.SceneBridge src/FutureCop.Render src/FutureCop.View tools/FcAssetTool tools/FcLevelStart tools/FcLevelTv tools/FcMainMenu; do
            dotnet build "$p" -v q
          done
      - name: Run xUnit test suite (asset-free tests; asset-dependent tests skip)
        run: dotnet test tests/FutureCop.Assets.Tests -v q
