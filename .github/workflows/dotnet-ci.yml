name: dotnet-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build all projects
        run: |
          # Tizen projects need TV framework DLLs (gitignored, local only) - skip them.
          for p in $(git ls-files '*.csproj' | grep -v '^tests/' | grep -vi 'tizen' | sed 's|/[^/]*$||' | sort -u); do
            dotnet build "$p"
          done
      - name: Run xUnit test suite (asset-free tests; asset-dependent tests skip)
        run: |
          # Discover test projects the same way as the build step.
          for p in $(git ls-files 'tests/*/*.csproj' | sed 's|/[^/]*$||' | sort -u); do
            dotnet test "$p" --no-build -v q
          done
