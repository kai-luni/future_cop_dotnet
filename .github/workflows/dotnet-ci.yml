name: dotnet-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build all projects
        run: |
          # Tizen projects need TV framework DLLs (gitignored, local only) - skip them.
          for p in $(git ls-files '*.csproj' | grep -v '^tests/' | grep -vi 'tizen' | sed 's|/[^/]*$||' | sort -u); do
            dotnet build "$p"
          done
      - name: Run xUnit test suite (asset-free tests; asset-dependent tests skip)
        run: |
          # Discover test projects the same way as the build step.
          total=0
          for p in $(git ls-files 'tests/*/*.csproj' | sed 's|/[^/]*$||' | sort -u); do
            out=$(dotnet test "$p" -v q)
            echo "$out"
            t=$(echo "$out" | grep -oP 'Total: \K[0-9]+' | paste -sd+ | bc)
            total=$((total + ${t:-0}))
          done
          # fail if no tests ran at all (silent zero-test pass guard)
          if [ "$total" -eq 0 ]; then
            echo "ERROR: no tests executed - CI is green but proves nothing"
            exit 1
          fi
